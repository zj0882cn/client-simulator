[auth]
; ============================================
; WoW Client Simulator 配置文件
; ============================================
; account: 游戏账号（必须与数据库中的用户名完全一致，包括大小写）
; password: 账号密码
; host: Auth 服务器地址
; port: Auth 服务器端口 (默认 3724)
; character: 角色名 (可选，留空自动选择第一个角色)
; bot_target: Bot 目标玩家 (可选，设置后会使用 Bot 模式)
; action: login / list / test
;   - login: 完整登录流程（认证 -> 进入游戏）
;   - list: 仅获取角色列表
;   - test: 仅测试认证连接
; ============================================

; 账号设置
account = your_account
password = your_password

; 服务器设置
host = 127.0.0.1
port = 3724

; 角色设置（可选）
character = 
bot_target = 

; 操作模式
action = login
